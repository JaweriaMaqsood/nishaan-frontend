<style>
:root{
  --bg:#170D30;
  --bg-soft:#20123F;
  --surface:#2A1650;
  --surface-2:#331C60;
  --border: rgba(255,255,255,0.12);
  --border-strong: rgba(255,255,255,0.24);
  --cyan:#00E5FF;
  --pink:#FF2E9A;
  --gold:#FFC24B;
  --lime:#B4FF3C;
  --text:#FBF9FF;
  --text-dim:#C4B8E8;
  --text-faint:#8A7CB8;
  --grad: linear-gradient(120deg,#00E5FF 0%,#FF2E9A 100%);
  --grad-warm: linear-gradient(120deg,#FF2E9A 0%,#FFC24B 100%);
  --grad-soft: linear-gradient(120deg, rgba(0,229,255,.18), rgba(255,46,154,.18));
  --radius-lg: 26px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --shadow-lg: 0 30px 80px -26px rgba(5,2,20,.75);
  --shadow-md: 0 16px 40px -16px rgba(5,2,20,.65);
  --font-display:'Fraunces','Inter',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'Space Mono',monospace;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:16px; line-height:1.62;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; position:relative;
}
body.lang-ur [data-i18n]{ font-family:'Noto Nastaliq Urdu', var(--font-body); }
body.lang-ur .i18n-rtl{ direction:rtl; text-align:right; }
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; }
button{ font-family:inherit; cursor:pointer; color:inherit; }
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; color:var(--text); }
.wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
.wrap-narrow{ max-width:720px; }
.grad-text{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }

.bg-fx{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.orb{ position:absolute; border-radius:50%; filter:blur(110px); opacity:.45; animation:float 20s ease-in-out infinite; }
.orb-cyan{ width:560px; height:560px; background:var(--cyan); top:-200px; right:-160px; }
.orb-pink{ width:480px; height:480px; background:var(--pink); top:380px; left:-180px; animation-delay:-8s; }
.orb-gold{ width:400px; height:400px; background:var(--gold); bottom:-160px; right:10%; animation-delay:-13s; opacity:.28; }
@keyframes float{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(30px,-36px) scale(1.08); } }
@keyframes callPulseAnim{ 0%{ transform:scale(1); opacity:.5; } 100%{ transform:scale(1.6); opacity:0; } }

/* Sehar welcome page animations */
@keyframes seharTwinkle{ 0%,100%{ opacity:.15; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.15); } }
.sehar-star{ position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; box-shadow:0 0 6px 1px rgba(255,255,255,.7); animation:seharTwinkle 3.2s ease-in-out infinite; }

@keyframes seharParticleFloat{ 0%,100%{ transform:translateY(0); opacity:.25; } 50%{ transform:translateY(-30px); opacity:.7; } }
.sehar-particle{ position:absolute; width:5px; height:5px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.9), transparent 70%); filter:blur(.5px); animation:seharParticleFloat 8s ease-in-out infinite; }

@keyframes seharSGlow{
  0%{ opacity:0; transform:scale(.82); }
  28%{ opacity:1; transform:scale(1); }
  68%{ opacity:1; transform:scale(1); }
  100%{ opacity:0; transform:scale(1.06); }
}

@keyframes seharFadeUp{ 0%{ opacity:0; transform:translateY(16px); } 100%{ opacity:1; transform:translateY(0); } }
.sehar-seq{ opacity:0; animation:seharFadeUp 1s cubic-bezier(.2,.8,.25,1) forwards; }

@keyframes seharBreathe{
  0%,100%{ box-shadow:0 0 0 0 rgba(255,46,154,.35), 0 12px 32px -10px rgba(255,46,154,.5); }
  50%{ box-shadow:0 0 0 10px rgba(255,46,154,0), 0 16px 40px -10px rgba(255,46,154,.65); }
}
.sehar-glow-btn{ animation:seharFadeUp 1s cubic-bezier(.2,.8,.25,1) forwards, seharBreathe 2.8s ease-in-out infinite; animation-delay:3.1s, 4.1s; transition:transform .3s ease; }
.sehar-glow-btn:hover{ transform:translateY(-2px) scale(1.02); }

.sehar-date-dot{ width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 14px 3px rgba(0,229,255,.55); margin:0 auto; }

@media (prefers-reduced-motion: reduce){
  .sehar-seq, .sehar-glow-btn{ opacity:1 !important; animation:none !important; }
}

.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:12.5px; letter-spacing:0.05em;
  color:var(--gold); margin-bottom:16px;
}
.eyebrow::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--grad); flex-shrink:0; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 26px; border-radius:999px; font-weight:700; font-size:15px;
  border:1.6px solid transparent; transition:transform .2s ease, box-shadow .2s ease;
  white-space:nowrap; font-family:var(--font-body);
}
.btn-primary{ background:var(--grad); color:#170D30; box-shadow:none; }
.btn-primary:hover{ transform:translateY(-2px) scale(1.02); box-shadow:0 8px 20px -8px rgba(255,46,154,.4); }
.btn-primary:active{ transform:translateY(0) scale(.97); }
.btn-outline{ background:rgba(255,255,255,0.04); border-color:var(--border-strong); color:var(--text); }
.btn-outline:hover{ border-color:var(--cyan); background:rgba(0,229,255,.08); transform:translateY(-2px); }
.btn-outline:active{ transform:translateY(0) scale(.97); }
.btn-lg{ padding:17px 32px; font-size:16px; }
.btn-block{ width:100%; }

.site-header{
  position:sticky; top:0; z-index:100;
  background:rgba(23,13,48,0.65); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent; transition:border-color .3s ease, background .3s ease;
}
.site-header.scrolled{ border-bottom-color:var(--border); background:rgba(23,13,48,0.92); }
.header-inner{ display:flex; align-items:center; justify-content:space-between; height:80px; gap:24px; }
.logo{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:20px; }
.logo-mark{ width:36px; height:36px; border-radius:11px; overflow:hidden; display:grid; place-items:center; flex-shrink:0; }
.nav-links{ display:flex; align-items:center; gap:30px; }
.nav-links a{ font-size:14.5px; color:var(--text-dim); font-weight:600; transition:color .2s ease; }
.nav-links a:hover{ color:var(--cyan); }
.header-actions{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
.menu-toggle{ display:none; flex-direction:column; justify-content:center; gap:5px; width:32px; height:32px; background:none; border:none; }
.menu-toggle span{ height:2px; width:100%; background:var(--text); border-radius:2px; transition:transform .3s ease, opacity .3s ease; }
.menu-toggle.active span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.menu-toggle.active span:nth-child(2){ opacity:0; }
.menu-toggle.active span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
.mobile-nav{ display:none; flex-direction:column; gap:2px; padding:8px 32px 20px; max-height:0; overflow:hidden; transition:max-height .35s ease; border-bottom:1px solid var(--border); }
.mobile-nav.open{ max-height:460px; }
.mobile-nav a{ padding:13px 0; font-size:15px; color:var(--text-dim); border-bottom:1px solid var(--border); font-weight:600; }
.mobile-nav-actions{ display:flex; gap:10px; margin-top:14px; }

.hero{ position:relative; z-index:1; padding:76px 0 100px; }
.hero-inner{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center; }
.hero-copy h1{ font-size:clamp(34px, 4.4vw, 54px); line-height:1.1; margin-bottom:22px; }
.hero-sub{ font-size:17.5px; color:var(--text-dim); max-width:480px; margin-bottom:30px; }
.hero-ctas{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.hero-note{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-faint); }

.hero-visual{ position:relative; }
.report-card{
  background:linear-gradient(180deg, rgba(42,22,80,.92), rgba(23,13,48,.96));
  border:1.6px solid var(--border-strong); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg); overflow:hidden; transform:rotate(1deg);
}
.report-top{ background:var(--grad); color:#170D30; padding:20px 24px; display:flex; align-items:center; justify-content:space-between; }
.report-top-label{ font-family:var(--font-mono); font-size:11px; font-weight:700; opacity:.75; }
.report-top-title{ font-family:var(--font-display); font-weight:700; font-size:16px; }
.report-body{ padding:22px 24px 6px; }
.report-row{ margin-bottom:18px; }
.report-subj{ font-size:14px; font-weight:700; color:var(--text); }
.report-pct{ font-family:var(--font-mono); font-size:13px; color:var(--text-dim); }
.report-bar{ height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:8px; }
.report-bar span{ display:block; height:100%; border-radius:99px; background:var(--grad); }
.report-bar.warn span{ background:var(--grad-warm); }
.report-divider{ height:1px; background:var(--border); margin:16px 0; }
.report-flag{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim); background:var(--surface); border:1.4px solid var(--border); border-radius:12px; padding:13px 15px; margin:0 24px 22px; }
.report-flag strong{ color:var(--gold); }
.report-flag-icon{ width:26px; height:26px; border-radius:50%; background:rgba(255,194,75,0.16); color:var(--gold); display:grid; place-items:center; flex-shrink:0; font-weight:700; }

section{ position:relative; z-index:1; padding:100px 0; scroll-margin-top:88px; }
.section-head{ max-width:640px; margin:0 auto 52px; }
.section-head.center{ text-align:center; margin-left:auto; margin-right:auto; }
.section-head h2{ font-size:clamp(28px,3.4vw,40px); margin-bottom:14px; }
.section-head p{ color:var(--text-dim); font-size:16px; }

.compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.compare-card{ border-radius:var(--radius-lg); padding:32px; border:1.6px solid var(--border); }
.compare-card.old{ background:var(--bg-soft); }
.compare-card.new{ background:var(--surface); border-color:var(--cyan); box-shadow:var(--shadow-md); }
.compare-label{ font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:16px; display:inline-block; }
.compare-card.old .compare-label{ color:var(--text-faint); }
.compare-card.new .compare-label{ color:var(--cyan); }
.compare-list{ display:flex; flex-direction:column; gap:14px; margin-top:18px; }
.compare-list li{ display:flex; align-items:flex-start; gap:10px; font-size:14.5px; color:var(--text-dim); }
.compare-mark{ flex-shrink:0; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; margin-top:1px; font-size:11px; font-family:var(--font-mono); font-weight:700; }
.compare-card.old .compare-mark{ background:rgba(255,255,255,.08); color:var(--text-faint); }
.compare-card.new .compare-mark{ background:rgba(0,229,255,.16); color:var(--cyan); }
.compare-card h3{ font-size:20px; }

.tools-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.tool-card{
  background:var(--surface); border:1.6px solid var(--border); border-radius:var(--radius-lg);
  padding:30px 26px; position:relative; transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
}
.tool-card:nth-child(1) .tool-icon{ color:var(--cyan); background:rgba(0,229,255,.14); border-color:rgba(0,229,255,.35); }
.tool-card:nth-child(2) .tool-icon{ color:var(--pink); background:rgba(255,46,154,.14); border-color:rgba(255,46,154,.35); }
.tool-card:nth-child(3) .tool-icon{ color:var(--gold); background:rgba(255,194,75,.14); border-color:rgba(255,194,75,.35); }
.tool-card:hover{ transform:translateY(-6px); box-shadow:var(--shadow-md); border-color:var(--border-strong); }
.tool-qnum{ font-family:var(--font-mono); font-size:12px; color:var(--text-faint); margin-bottom:14px; }
.tool-icon{
  width:50px; height:50px; border-radius:14px; display:grid; place-items:center;
  border:1.6px solid var(--border-strong); margin-bottom:18px;
}
.tool-card h3{ font-size:19px; margin-bottom:10px; }
.tool-card p{ color:var(--text-dim); font-size:14.5px; margin-bottom:14px; }
.tool-example{
  font-family:var(--font-mono); font-size:12px; color:var(--text-dim); background:var(--bg-soft);
  border-radius:10px; padding:10px 12px; border-left:3px solid var(--pink);
}

.how-steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:36px; }
.how-step{ position:relative; padding-top:8px; }
.how-num{
  font-family:var(--font-display); font-size:16px; font-weight:700; color:#170D30;
  width:42px; height:42px; border-radius:12px; background:var(--grad); display:grid; place-items:center;
  margin-bottom:16px;
}
.how-step h3{ font-size:18px; margin-bottom:8px; }
.how-step p{ font-size:14.5px; color:var(--text-dim); }

.pricing-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:22px; max-width:760px; margin:0 auto; }
.price-card{
  background:var(--surface); border:1.6px solid var(--border); border-radius:var(--radius-lg);
  padding:32px 28px; display:flex; flex-direction:column; position:relative;
}
.price-card.featured{ border-color:var(--pink); box-shadow:0 24px 60px -24px rgba(255,46,154,.4); background:linear-gradient(180deg, rgba(255,46,154,.08), rgba(0,229,255,.04)); }
.price-badge{
  position:absolute; top:-13px; left:28px; background:var(--grad); color:#170D30; font-family:var(--font-mono);
  font-size:11px; font-weight:700; padding:5px 14px; border-radius:999px; letter-spacing:.02em;
}
.price-card h3{ font-size:19px; margin-bottom:6px; }
.price-desc{ font-size:13.5px; color:var(--text-faint); margin-bottom:22px; }
.price-amount{ font-family:var(--font-display); font-size:38px; font-weight:700; margin-bottom:24px; }
.price-amount .per{ font-size:14px; font-weight:500; color:var(--text-dim); font-family:var(--font-body); }
.price-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:26px; flex:1; }
.price-list li{ display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--text-dim); }
.price-check{ flex-shrink:0; width:19px; height:19px; border-radius:50%; background:rgba(180,255,60,.16); color:var(--lime); display:grid; place-items:center; font-size:10px; font-family:var(--font-mono); font-weight:700; }

.faq-list{ display:flex; flex-direction:column; gap:10px; }
.faq-item{ background:var(--surface); border:1.6px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
.faq-q{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:19px 22px; background:none; border:none; color:var(--text); font-size:15px; font-weight:700; text-align:left;
  font-family:var(--font-body);
}
.faq-item .chevron{ transition:transform .3s ease; color:var(--text-faint); flex-shrink:0; }
.faq-item.open .chevron{ transform:rotate(180deg); color:var(--pink); }
